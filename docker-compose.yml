services:
  gen-workplace:
    build:
      context: .
      dockerfile: Dockerfile
    image: gen-workplace:latest
    container_name: gen-workplace-app
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - gen-workplace-data:/app/data:z
      - ./workspace:/workspace:z
      - ./frontend:/app/frontend:ro,z
      - ./backend:/app/backend:z
      - ./assets:/app/assets:ro,z
      - ./docs:/app/docs:ro,z
      - ./:/app/repo:ro,z
      - ${HOME:-/root}/.agy-profiles:${HOME:-/root}/.agy-profiles:z
      - ${HOME:-/root}/.gemini:${HOME:-/root}/.gemini:z
      - ${HOME:-/root}/.local/bin/agy:/usr/local/bin/agy:ro,z
      - /tmp/tmux-${UID:-1000}:/tmp/tmux-1000:z
    environment:
      - PORT=8888
      - DATA_DIR=/app/data
      - DOCKER_CONTAINER=1
      - HOME=${HOME:-/root}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  gen-workplace-data:
    driver: local
